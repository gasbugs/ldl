name: Publish LDL Bedrock Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - llm-security-control-plane/bedrock-gateway/**
      - llm-security-control-plane/shared/telemetry.py
      - .github/workflows/publish-bedrock-gateway.yml
      - llm-security-control-plane/tests/publication_gateway.py

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-bedrock-gateway
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/gasbugs/ldl-bedrock-gateway

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Select immutable image tags
        id: version
        run: |
          echo "value=v$(TZ=Asia/Seoul date +%Y.%m.%d.%H.%M)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Gateway image
        uses: docker/build-push-action@v7
        with:
          context: llm-security-control-plane
          file: llm-security-control-plane/bedrock-gateway/Containerfile
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/gasbugs/llm-defense-lab
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Check Gateway startup without an AWS request
        run: |
          docker run -d --name gateway-publication-check \
            -e BEDROCK_GATEWAY_TOKEN=publication-check \
            -e AWS_ACCESS_KEY_ID=publication-fixture \
            -e AWS_SECRET_ACCESS_KEY=publication-fixture \
            -e AWS_EC2_METADATA_DISABLED=true \
            -e PYTHONPATH=/app \
            -v "$PWD/llm-security-control-plane/tests/publication_gateway.py:/tmp/publication_gateway.py:ro" \
            --entrypoint python \
            -p 127.0.0.1:18096:8080 \
            "$IMAGE:${{ steps.version.outputs.value }}" /tmp/publication_gateway.py
          trap 'docker rm -f gateway-publication-check' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18096/healthz > /tmp/gateway-health.json; then
              jq -e '.ok == true' /tmp/gateway-health.json
              test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18096/v1/models)" = 401
              exit 0
            fi
            sleep 1
          done
          docker logs gateway-publication-check
          exit 1

      - name: Publish tested image
        run: |
          docker push "$IMAGE:${{ steps.version.outputs.value }}"
          docker push "$IMAGE:sha-${{ github.sha }}"
          echo "### Gateway image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:${{ steps.version.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
