# CUSTOM FILE
# Format reference: nginx configuration, https://nginx.org/en/docs/
# Upstream license: BSD-2-Clause

worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $host $guided_home_host_allowed {
    default 0;
    127.0.0.1 1;
    localhost 1;
    book-neb4p1e6db.tail36e6cc.ts.net 1;
    include /etc/nginx/guided-ec2/hosts/*.conf;
  }

  map $host $guided_aux_host_allowed {
    default 0;
    127.0.0.1 1;
    localhost 1;
    include /etc/nginx/guided-ec2/hosts/*.conf;
  }

  include /etc/nginx/guided-ec2/servers/*.conf;

  # 개별 서비스만 재생성해 IP가 바뀌어도 Docker DNS에서 새 주소를 확인한다.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream guided_control_center_backend {
    zone guided_control_center_backend 64k;
    server guided-control-center:8000 resolve;
  }
  upstream guided_nemo_ui_backend {
    zone guided_nemo_ui_backend 64k;
    server guided-nemo-ui:8000 resolve;
  }

  server {
    listen 18097;
    server_name 127.0.0.1 localhost book-neb4p1e6db.tail36e6cc.ts.net;

    if ($guided_home_host_allowed = 0) { return 421; }

    location = /proxy-healthz {
      access_log off;
      return 200 'front-proxy-ready';
      add_header Content-Type text/plain;
    }

    # 브라우저가 자기 PC의 loopback으로 가지 않게 같은 출처에서 받은 요청만
    # EC2 호스트의 고정 명령 삭제 브리지로 전달한다.
    location /reset-bridge/ {
      rewrite ^/reset-bridge/(.*)$ /$1 break;
      set $reset_bridge host.docker.internal:28198;
      proxy_pass http://$reset_bridge;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:28198;
      proxy_set_header Origin http://127.0.0.1:28097;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 3s;
      proxy_read_timeout 1900s;
      proxy_next_upstream off;
    }

    location ~ ^/api/(practice/P12|hands-on/H12)/verify$ {
      proxy_pass http://guided_control_center_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto http;
      proxy_connect_timeout 3s;
      proxy_read_timeout 980s;
      proxy_next_upstream off;
    }

    location ~ ^/api/(practice/P03|hands-on/H03)/(provision|verify)$ {
      proxy_pass http://guided_control_center_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto http;
      proxy_connect_timeout 3s;
      proxy_read_timeout 500s;
      proxy_next_upstream off;
    }

    location / {
      proxy_pass http://guided_control_center_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Port 18097;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 18192;
    server_name 127.0.0.1 localhost;

    if ($guided_aux_host_allowed = 0) { return 421; }

    location / {
      proxy_pass http://guided_nemo_ui_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Port 18192;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect http://guided-nemo-ui:8000/ /;
    }
  }
}
