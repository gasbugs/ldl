# CUSTOM FILE
# NeMo configuration: https://docs.nvidia.com/nemo/guardrails/latest/configure-rails/overview
# Format reference license: Apache-2.0
models:
  - type: main
    engine: openai
    model: us.amazon.nova-lite-v1:0
    parameters:
      base_url: http://llm-security-bedrock-gateway:8080/v1
      temperature: 0.0
    api_key_env_var: BEDROCK_GATEWAY_TOKEN
rails:
  dialog:
    user_messages:
      embeddings_only: true
      embeddings_only_similarity_threshold: 0.45
      embeddings_only_fallback_intent: unsupported request
core:
  embedding_search_provider:
    name: default
    parameters:
      embedding_engine: FastEmbed
      embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      embedding_parameters:
        cache_dir: /opt/nemo-cache
